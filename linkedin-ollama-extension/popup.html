<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Ollama Writer</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; width: 340px; }
      textarea { width: 100%; min-height: 110px; padding: 8px; box-sizing: border-box; }
      button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; }
      .status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; }
      .row { display:flex; gap:8px; margin-top: 10px; }
      .row button { width: auto; flex: 1; }
    </style>
  </head>
  <body>
    <h3 style="margin:0 0 8px 0;">LinkedIn Ollama Writer</h3>
    <textarea id="topic" placeholder="Enter topic / prompt…"></textarea>

    <div class="row">
      <button id="generate">Generate & Insert</button>
    </div>

    <div id="status" class="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
